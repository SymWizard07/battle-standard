name: Save Helper release

on:
  push:
    tags:
      - 'save-helper-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
          - os: macos-latest
            pack: pack:mac
          - os: ubuntu-latest
            pack: pack:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --prefix companion/host
          npm ci --prefix companion/tray

      - name: Build and pack
        working-directory: companion/tray
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.pack }}

      - name: Collect distributables
        working-directory: companion/tray
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in release/*.exe release/*.dmg release/*.AppImage release/*.deb; do
            cp "$f" release-assets/
          done
          if [ ! "$(ls -A release-assets)" ]; then
            echo "No distributables found"
            ls -la release
            exit 1
          fi
          ls -la release-assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: save-helper-${{ matrix.os }}
          path: companion/tray/release-assets/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#save-helper-v}" >> "$GITHUB_OUTPUT"

      - name: List release files
        run: find artifacts -maxdepth 1 -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Save Helper v${{ steps.version.outputs.version }}
          overwrite: true
          body: |
            ## Battle Standard Save Helper v${{ steps.version.outputs.version }}

            One-time setup app + native host for saving campaigns outside the browser.

            ### Install

            1. Install the [Firefox extension](https://addons.mozilla.org/firefox/downloads/file/4873162/c499cfaf782b48d1996b-0.1.0.xpi) (Mozilla Add-ons, v0.1.0).
            2. Download and run the **Setup** build for your platform below (registers the native host).
            3. Open Battle Standard and choose a save folder when prompted.

            ### Downloads

            | Platform | Setup files |
            |----------|-------------|
            | **Windows x64** | `*Setup*-portable-x64.exe` or `*Setup*-installer-x64.exe` |
            | **Windows arm64** | `*Setup*-portable-arm64.exe` or `*Setup*-installer-arm64.exe` |
            | **macOS Intel** | `*Setup*-x64.dmg` |
            | **macOS Apple Silicon** | `*Setup*-arm64.dmg` |
            | **Linux x64** | `*Setup*-x86_64.AppImage` or `*Setup*-amd64.deb` |
            | **Linux arm64** | `*Setup*-arm64.AppImage` or `*Setup*-arm64.deb` |

            Save folder is chosen from the Battle Standard website (system folder dialog).

            ### Notes

            - Campaigns still save in the browser without Save Helper.
            - macOS builds are unsigned — you may need to allow the app in System Settings → Privacy & Security.
            - Setup only needs to run once per machine (re-run after major host updates).
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
          draft: false
          prerelease: false
